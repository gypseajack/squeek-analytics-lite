
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Squeek Analytics Lite</title>
<style>
body{background:#0b101a;color:#f4f6fa;font:16px Arial;margin:0;padding:35px}
main{max-width:1000px;margin:auto}
h1{color:#89d8fa}
p{color:#abb9cb}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px}
.card{background:#172237;border:1px solid #34445c;border-radius:12px;padding:20px;overflow-wrap:anywhere}
pre{white-space:pre-wrap;max-height:220px;overflow:auto;font-size:12px}
button{padding:12px;background:#89d8fa;border:0;border-radius:8px;cursor:pointer}
a{color:#89d8fa}
</style>
</head>
<body>
<main>
<h1>🐹 Squeek Analytics Lite</h1>
<p>Community dashboard for Squeekchain Sepolia.</p>
<p>Read-only. No wallet required.</p>
<button onclick="load()">Refresh network data</button>
<p id="status">Loading...</p>
<div class="grid" id="grid"></div>
<p>Sources:
<a href="https://docs.squeekchain.com/developers/">
Official Squeekchain documentation</a></p>
<p>Unofficial community project. Testnet data only.</p>
</main>
<script>
const endpoints=[
["Pipeline status","/v1/status"],
["Hamster activity","/v1/measurement/stats?range=7d"],
["SqueekCore","/v1/core"],
["SQK economy","/v1/economy/state"],
["Recent events","/v1/events?limit=5"]
];
async function load(){
const grid=document.getElementById("grid");
grid.textContent="";
document.getElementById("status").textContent="Checking official API...";
let success=0;
for(const [name,path] of endpoints){
const card=document.createElement("div");
card.className="card";
const heading=document.createElement("h2");
heading.textContent=name;
const result=document.createElement("pre");
result.textContent="Loading...";
card.append(heading,result);
grid.append(card);
try{
const response=await fetch("https://api.squeekchain.com"+path);
if(!response.ok)throw Error("HTTP "+response.status);
const data=await response.json();
result.textContent=JSON.stringify(data,null,2);
success++;
}catch(e){
result.textContent="Data unavailable: "+e.message;
}
}
document.getElementById("status").textContent=
success+" / "+endpoints.length+" API endpoints responding";
}
load();
</script>
</body>
</html>
